<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bharat Cloud One</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui}body{background:#000;color:#fff;min-height:100vh}.b{padding:14px 16px;border:0;border-radius:12px;font-weight:600;cursor:pointer;font-size:13px}.gd{background:#fff;color:#000}.go{background:#FFD60A;color:#000}.k{font-size:10px;color:#666}.card{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:16px;padding:14px;margin:8px}.sec{display:none}.sec.a{display:block}.inp{width:100%;padding:14px;border-radius:12px;border:1px solid #222;background:#111;color:#fff;margin:6px 0;font-size:14px}.mBtn{padding:10px 16px;border-radius:20px;border:1px solid #222;background:#111;color:#888;font-size:12px}.mBtn.a{background:#fff;color:#000;font-weight:600}.msg{background:#111;border:1px solid #222;border-radius:12px;padding:12px;margin:6px 0;font-size:12px}.msg.user{background:#fff;color:#000}.msg.ai{background:#0a0a0a;color:#fff}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:20px;font-size:11px;display:none;z-index:99;font-weight:600}#toast.on{display:block}</style></head><body>
<div id=toast></div>
<div id=lock style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px"><div style="max-width:320px;width:100%;text-align:center"><div style="font-size:32px">◉</div><div style="font-size:22px;font-weight:700;margin-top:12px">BHARAT CLOUD ONE</div><div style="font-size:11px;color:#666;margin-top:6px">Business OS • Offline • Secure</div><input id=pinInp class=inp placeholder="PIN" type=password style="margin-top:28px;text-align:center"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><button class="b gd" onclick=ul()>Enter</button><button class="b go" onclick=ul()>Fingerprint</button></div></div></div>
<div id=main style="display:none">
<div style="display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #1a1a1a;position:sticky;top:0;background:#000;z-index:10"><div style="font-weight:700">◉ BCO</div></div>
<div style="display:flex;gap:8px;overflow:auto;padding:12px 16px"><button class="mBtn a" id=m_ai onclick="sh('ai')">AI</button><button class="mBtn" id=m_business onclick="sh('business')">Business</button><button class="mBtn" id=m_customer onclick="sh('customer')">Customers</button></div>
<div id=sec_ai class="sec a"><div class=card style="min-height:50vh;display:flex;flex-direction:column"><div style="font-size:13px;font-weight:600">Personal AI</div><div id=aiChat style="flex:1;overflow:auto;margin-top:16px"><div class=msg ai>Hi, I'm your personal business assistant. Ask about profit, customers, stock.</div></div><div style="display:flex;gap:8px;margin-top:12px"><input id=aiInp class=inp placeholder="Ask anything..." style="flex:1;margin:0"><button class="b gd" onclick=sendAI()>Ask</button></div></div></div>
<div id=sec_business class="sec"><div class=card><div style="font-size:13px;font-weight:600">Business • Killer Banker</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px"><div><div style="font-size:11px;color:#666">Products</div><div style="display:flex;gap:6px;margin-top:8px"><input id=pName class=inp placeholder="Product" style="flex:1"><input id=pBuy class=inp type=number placeholder="Buy" style="width:80px"><input id=pSell class=inp type=number placeholder="Sell" style="width:80px"><button class="b gd" onclick=ap()>Add</button></div><div id=pList style="margin-top:10px"></div></div><div><div style="font-size:11px;color:#666">Orders</div><div style="display:flex;gap:6px;margin-top:8px"><input id=oCust class=inp placeholder="Customer" style="flex:1"><input id=oAmt class=inp type=number placeholder="Amount" style="width:100px"><button class="b gd" onclick=ao()>Bill</button></div><div id=oList style="margin-top:10px"></div><div style="margin-top:16px;padding:12px;background:#000;border:1px solid #222;border-radius:12px"><div style="font-size:12px">Total <b id=totalEarn>₹0</b> • Profit <b id=totalProfit>₹0</b> • Margin <b id=genuineRate>0%</b></div></div></div></div></div></div>
<div id=sec_customer class="sec"><div class=card><div style="font-size:13px;font-weight:600">Customers</div><div style="display:flex;gap:6px;margin-top:12px"><input id=contactName class=inp placeholder="Name" style="flex:1"><input id=contactNum class=inp placeholder="Mobile" style="flex:1"><button class="b go" onclick=addCustomer()>Add</button></div><div id=contactList style="margin-top:12px"></div></div></div>
</div>
</div>
<script>
window.onerror=function(){return true};var IS_OWNER=false;var PIN=localStorage.getItem('BC_PIN_V238')||"7055";
function showToast(t){var e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},2000)}
function ul(){IS_OWNER=true;document.getElementById('lock').style.display='none';document.getElementById('main').style.display='block';init();ra()}
function gd(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}}
function mg(){try{var p=[],o=[],c=[];for(var v=160;v<=238;v++){try{p=p.concat(JSON.parse(localStorage.getItem('BC_PRODUCTS_V'+v)||"[]"))}catch(e){}try{o=o.concat(JSON.parse(localStorage.getItem('BC_ORDERS_V'+v)||"[]"))}catch(e){}try{c=c.concat(JSON.parse(localStorage.getItem('BC_CONTACTS_V'+v)||"[]"))}catch(e){}}try{p=p.concat(JSON.parse(localStorage.getItem('BC_PRODUCTS')||"[]"))}catch(e){}try{p=p.concat(JSON.parse(localStorage.getItem('BC_PRODUCTS_V150')||"[]"))}catch(e){}try{o=o.concat(JSON.parse(localStorage.getItem('BC_ORDERS')||"[]"))}catch(e){}try{o=o.concat(JSON.parse(localStorage.getItem('BC_ORDERS_V150')||"[]"))}catch(e){}try{c=c.concat(JSON.parse(localStorage.getItem('BC_CONTACTS')||"[]"))}catch(e){}for(var i=0;i<5;i++){try{var s=localStorage.getItem('BC_SHARD_'+i);if(s){var d=JSON.parse(atob(s));if(d.p)p=p.concat(d.p);if(d.o)o=o.concat(d.o);if(d.c)c=c.concat(d.c)}}catch(e){}}var u={},q=[];p.forEach(function(x){if(!x||!x.name)return;var k=(x.id||"")+x.name;if(!u[k]){u[k]=1;q.push(x)}});p=q;u={};q=[];o.forEach(function(x){var k=(x.id||"")+ (x.cust||"");if(!u[k]){u[k]=1;q.push(x)}});o=q;return{p:p,o:o,c:c}}catch(e){return{p:[],o:[],c:[]}}}
function sh(id){document.querySelectorAll('.sec').forEach(function(s){s.classList.remove('a')});document.getElementById('sec_'+id).classList.add('a');document.querySelectorAll('.mBtn').forEach(function(b){b.classList.remove('a')});document.getElementById('m_'+id).classList.add('a')}
function init(){if(!localStorage.getItem('BC_PRODUCTS_V238')||JSON.parse(localStorage.getItem('BC_PRODUCTS_V238')||"[]").length===0){var d=mg();if(d.p.length===0){var killer=[{id:Date.now()+1,name:"Killer Rice 25kg",buy:1050,sell:1280,qty:20},{id:Date.now()+2,name:"Killer Oil 15L",buy:1550,sell:1850,qty:12},{id:Date.now()+3,name:"Killer Sugar 50kg",buy:2100,sell:2500,qty:15},{id:Date.now()+4,name:"Killer Flour 25kg",buy:950,sell:1150,qty:25},{id:Date.now()+5,name:"Killer Tea 1kg",buy:420,sell:520,qty:30},{id:Date.now()+6,name:"Killer Banker Loan",buy:0,sell:5000,qty:1},{id:Date.now()+7,name:"Killer Dal 10kg",buy:800,sell:1000,qty:18},{id:Date.now()+8,name:"Killer Salt 25kg",buy:300,sell:450,qty:40}];localStorage.setItem('BC_PRODUCTS_V238',JSON.stringify(killer));localStorage.setItem('BC_PRODUCTS_V150',JSON.stringify(killer))}}}
function sendAI(){var inp=document.getElementById('aiInp');var txt=inp.value.trim();if(!txt)return;var chat=document.getElementById('aiChat');var you=document.createElement('div');you.className='msg user';you.innerText=txt;chat.appendChild(you);var data=mg();var tot=data.o.reduce(function(s,x){return s+(parseInt(x.amt)||0)},0);var profit=data.p.reduce(function(s,x){return s+((parseInt(x.sell)||0)-(parseInt(x.buy)||0))*(parseInt(x.qty)||1)},0);var margin=0;var totSell=data.p.reduce(function(s,x){return s+((parseInt(x.sell)||0)*(parseInt(x.qty)||1))},0);if(totSell>0)margin=Math.round((profit/totSell)*100);var reply='Products '+data.p.length+' • Orders '+data.o.length+' • Customers '+data.c.length+' • Profit ₹'+profit+' • Total ₹'+tot+' • Margin '+margin+'%';var ai=document.createElement('div');ai.className='msg ai';ai.innerText=reply;chat.appendChild(ai);chat.scrollTop=chat.scrollHeight;inp.value=''}
function addCustomer(){var name=document.getElementById('contactName').value.trim();var num=document.getElementById('contactNum').value.trim();if(!name||!num){alert("Name + Mobile");return}var c=gd('BC_CONTACTS_V238');c.push({id:Date.now(),name:name,num:num});localStorage.setItem('BC_CONTACTS_V238',JSON.stringify(c));localStorage.setItem('BC_CONTACTS_V150',JSON.stringify(c));document.getElementById('contactName').value="";document.getElementById('contactNum').value="";ra();showToast("Customer added")}
function ap(){var name=document.getElementById('pName').value.trim();if(!name)return;var buy=parseInt(document.getElementById('pBuy').value)||0;var sell=parseInt(document.getElementById('pSell').value)||0;var p=gd('BC_PRODUCTS_V238');p.push({id:Date.now(),name:name,buy:buy,sell:sell,qty:1});localStorage.setItem('BC_PRODUCTS_V238',JSON.stringify(p));localStorage.setItem('BC_PRODUCTS_V150',JSON.stringify(p));document.getElementById('pName').value="";document.getElementById('pBuy').value="";document.getElementById('pSell').value="";ra();showToast("Product added")}
function ao(){var cust=document.getElementById('oCust').value.trim()||"Customer";var amt=parseInt(document.getElementById('oAmt').value)||0;if(amt<=0){alert("Amount");return}var o=gd('BC_ORDERS_V238');o.push({id:Date.now(),cust:cust,amt:amt});localStorage.setItem('BC_ORDERS_V238',JSON.stringify(o));localStorage.setItem('BC_ORDERS_V150',JSON.stringify(o));document.getElementById('oCust').value="";document.getElementById('oAmt').value="";ra();showToast("Bill added")}
function ra(){var data=mg();var p=data.p;var o=data.o;var tot=o.reduce(function(s,x){return s+(parseInt(x.amt)||0)},0);var totSell=p.reduce(function(s,x){return s+((parseInt(x.sell)||0)*(parseInt(x.qty)||1))},0);var profit=p.reduce(function(s,x){return s+((parseInt(x.sell)||0)-(parseInt(x.buy)||0))*(parseInt(x.qty)||1)},0);document.getElementById('pList').innerHTML=p.length?p.map(function(x){return '<div class=card style="padding:10px;margin:6px 0"><b>'+x.name+'</b> • Buy ₹'+x.buy+' • Sell ₹'+x.sell+'</div>'}).join(''):'<div class=k style="padding:10px">No products</div>';document.getElementById('oList').innerHTML=o.length?o.map(function(x){return '<div class=card style="padding:10px;margin:6px 0">'+x.cust+' • ₹'+x.amt+'</div>'}).join(''):'<div class=k style="padding:10px">No orders</div>';document.getElementById('contactList').innerHTML=data.c.length?data.c.map(function(x){return '<div class=card style="padding:10px;margin:6px 0;display:flex;justify-content:space-between"><span><b>'+x.name+'</b> '+x.num+'</span><button class="b" style="padding:6px 10px;background:#FFD60A;color:#000;font-size:11px" onclick="window.open(\'https://wa.me/'+x.num.replace(/[^0-9]/g,'')+'\',\'_blank\')">WA</button></div>'}).join(''):'<div class=k style="padding:10px">No customers</div>';document.getElementById('totalEarn').innerText='₹'+tot;document.getElementById('totalProfit').innerText='₹'+profit;document.getElementById('genuineRate').innerText=(totSell>0?Math.round((profit/totSell)*100):0)+'%';try{var full={p:p,o:o,c:data.c,ts:Date.now()};var j=JSON.stringify(full);localStorage.setItem('BC_SHARD_0',btoa(j.slice(0,4000)))}catch(e){}}
ra();
</script></body></html>
