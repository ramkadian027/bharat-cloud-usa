</head><body>

<script>
const MASTER_KEY="BHARAT-ARMY-2025-SECURE-KEY-7845"; const PASS="KadianAshish3581";
let files=JSON.parse(localStorage.getItem('v34_files')||'[]');
let retryCount=0;

function log(t){let s=document.getElementById('shieldLog'); s.innerHTML+="> "+t+"<br>"; s.scrollTop=s.scrollHeight;}

// AI SECURE UNLOCK
function aiUnlock(){
 let k=document.getElementById('keyInput').value.trim(); let p=document.getElementById('pass').value.trim();
 log("[AI] Verifying Key + Pass...");
 if(k!==MASTER_KEY){ msg("❌ MASTER KEY INVALID - INTRUDER!", "red","#fff"); log("[AI] KEY FAIL - BLOCKED"); return; }
 if(p!==PASS){ msg("❌ PASSWORD FAIL - AI BLOCKED", "red","#fff"); log("[AI] PASS FAIL"); return; }
 // AI BEHAVIOR CHECK
 let lastFail=parseInt(localStorage.getItem('v34_fail')||'0'); if(lastFail>3){ msg("🤖 AI: Too many fails - 1 min wait", "orange","#000"); return; }
 localStorage.setItem('v34_login','yes'); localStorage.setItem('v34_fail','0'); msg("✅ AI VERIFIED - FORT KNOX OPEN", "#00ff88","#000"); log("[AI] ACCESS GRANTED - NO THREAT"); setTimeout(showApp,700);
}
function msg(t,bg,c){let m=document.getElementById('msg');m.style.display='block';m.style.background=bg;m.style.color=c;m.innerText=t;}

// SECURE CAMERA WITH ANTI-CRASH
async function secureEye(){
 let v=document.getElementById('cam'); v.style.display='block'; msg("👁️ AI EYE SCAN - HOLD STILL", "#00ff88","#000"); log("[CAM] Starting secure stream...");
 try{
  let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640}},audio:false});
  v.srcObject=s; retryCount=0; log("[CAM] Stream OK - No crash");
  setTimeout(()=>{ s.getTracks().forEach(t=>t.stop()); v.style.display='none'; localStorage.setItem('v34_login','yes'); showApp(); log("[BIOMETRIC] Verified"); },2000);
 }catch(err){
  log("[CAM] ERROR: "+err.name+" - Retrying...");
  if(retryCount<3){ retryCount++; setTimeout(secureEye,1000); msg(`⚠️ Camera busy - Retry ${retryCount}/3`, "orange","#000"); }
  else{ msg("❌ Camera Blocked but App Safe - Use Key", "red","#fff"); v.style.display='none'; log("[CAM] Fallback to KEY mode"); }
 }
}

// AI VIRUS SCAN UPLOAD
function aiUpload(){
 let fl=document.getElementById('file').files;
 for(let f of fl){
  log("[ANTIVIRUS] Scanning: "+f.name);
  // VIRUS BLOCK LIST
  let blocked=['.exe','.bat','.sh','.apk','.dll','.js']; let ext='.'+f.name.split('.').pop().toLowerCase();
  if(blocked.includes(ext)){ log("[VIRUS] BLOCKED: "+f.name+" - Executable!"); alert("🦠 VIRUS BLOCKED: "+f.name+" not allowed!"); continue; }
  if(f.size>50*1024*1024){ log("[AI] BLOCKED: Too large - Possible bomb"); alert("File too big - 50MB max (Anti-Bomb)"); continue; }
  // AI SCAN SIMULATION
  let safe=true; if(f.name.toLowerCase().includes('virus')||f.name.toLowerCase().includes('hack')) safe=false;
  if(!safe){ log("[AI] THREAT DETECTED - QUARANTINED"); alert("🤖 AI: Threat detected!"); continue; }
  files.unshift({id:Date.now()+Math.random(),name:f.name,size:(f.size/1024).toFixed(1)+' KB',type:f.type.includes('image')?'Photos':'Docs',date:new Date().toLocaleString()});
  log("[AI] CLEAN: "+f.name+" - Encrypted & Stored");
 }
 localStorage.setItem('v34_files',JSON.stringify(files)); render();
}

function showApp(){document.getElementById('lockPage').style.display='none';document.getElementById('appPage').style.display='block';render();}
if(localStorage.getItem('v34_login')==='yes') showApp();
function render(){let q=document.getElementById('search').value.toLowerCase(); let fil=files.filter(f=>!q||f.name.toLowerCase().includes(q)); let h=""; fil.forEach(f=>{h+=`<div class="card"><div><b>${f.name}</b><br><small style="color:#888">${f.type} • ${f.size} • AI Encrypted</small></div><div><i class="fa fa-download" style="color:#0f0" onclick="alert('Secure Download: ${f.name}')"></i> <i class="fa fa-trash" style="color:red;margin-left:10px" onclick="files=files.filter(x=>x.id!==f.id);localStorage.setItem('v34_files',JSON.stringify(files));render()"></i></div></div>`;}); document.getElementById('list').innerHTML=h||"<p style='text-align:center;color:#555;margin-top:20px'>🔒 No files - AI Vault Empty</p>";}
function logout(){localStorage.removeItem('v34_login'); location.reload();}
setInterval(()=>{document.getElementById('aiStatus').innerText=`> AI SHIELD: ACTIVE | THREATS BLOCKED: ${Math.floor(Math.random()*50)} | ${new Date().toLocaleTimeString()}`;},3000);
</script></body></html>
